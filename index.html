<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finance Tracker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h2 id="pageTitle">📤 Мои расходы</h2>

    <div class="input-group">
        <label>Сумма</label>
        <input type="number" id="amount" placeholder="0" inputmode="decimal">
    </div>

    <div class="input-group">
        <label>Категория</label>
        <select id="category"></select>
    </div>

    <div class="input-group">
        <label>Подкатегория</label>
        <select id="subcategory"></select>
    </div>

    <div class="input-group">
        <label>Комментарий</label>
        <input type="text" id="comment" placeholder="Например: Обед в кафе">
    </div>

    <div class="loading" id="loading">Загрузка данных...</div>
    <div class="list" id="transactionList"></div>

    <div class="total-block">
        Итого: <span id="total">0</span> ₽
    </div>

    <div class="tab-bar">
        <button class="tab active" id="tabExpense" onclick="switchTab('expense')">📤 Расходы</button>
        <button class="tab" id="tabIncome" onclick="switchTab('income')">💵 Доходы</button>
    </div>

    <script src="js/config.js"></script>
    <script src="js/categories.js"></script>
    <script src="js/telegram.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
